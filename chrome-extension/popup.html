<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>pwman</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      background: #1E1E1E;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    .container { padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 12px 0; }
    input[type="password"], input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin-bottom: 8px;
      background: #2D2D2D;
      border: 1px solid #555;
      color: white;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #3A7CA5;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #326a8f; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary { background: #555; }
    button.secondary:hover { background: #444; }
    #status {
      color: #E06666;
      font-size: 12px;
      margin-top: 6px;
      min-height: 14px;
    }
    #entries { margin-top: 12px; max-height: 260px; overflow-y: auto; }
    .entry {
      background: #2D2D2D;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 6px;
    }
    .entry .service { font-weight: 600; margin-bottom: 6px; }
    .entry .actions { display: flex; gap: 6px; }
    .entry .actions button { flex: 1; font-size: 12px; padding: 5px; }
    #lockRow { margin-top: 10px; }
    #lockRow button { background: #555; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔒 pwman</h1>

    <div id="authView">
      <input type="password" id="masterPasswordInput" placeholder="Master password" />
      <button id="unlockButton">Unlock</button>
      <div id="status"></div>
    </div>

    <div id="vaultView" class="hidden">
      <div id="entries"></div>
      <div id="lockRow">
        <button id="lockButton">Lock</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
